name: 'Publish MineInAbyss schemas'
description: 'Generates JSON schemas with a Gradle task and pushes them to our server config repos'
inputs:
  gradle-task:
    description: 'Gradle task that writes schemas into the directory given by -PschemaOutput'
    required: true
  token:
    description: 'Token with contents write access to every repo in config-repos'
    required: true
  config-repos:
    description: 'Space separated repos to push schemas to'
    required: false
    default: 'MineInAbyss/server-config MineInAbyss/server-config-private'
  develop-branch:
    description: 'Source branch whose schemas go to the develop config branch'
    required: false
    default: 'develop'
  release-branch:
    description: 'Source branch whose schemas go to the prod config branch'
    required: false
    default: 'master'
  config-develop-branch:
    required: false
    default: 'develop'
  config-release-branch:
    required: false
    default: 'prod'
  skip-java-setup:
    description: "Don't set up the JDK and Gradle, for workflows that already did"
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Pick config branch
      id: branch
      shell: bash
      run: |
        case "${{ github.ref }}" in
          "refs/heads/${{ inputs.develop-branch }}") echo "target=${{ inputs.config-develop-branch }}" >> "$GITHUB_OUTPUT" ;;
          "refs/heads/${{ inputs.release-branch }}") echo "target=${{ inputs.config-release-branch }}" >> "$GITHUB_OUTPUT" ;;
          *) echo "Not a develop or release branch, skipping schema publishing" ;;
        esac

    - name: ☕️ Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 25
      if: ${{ steps.branch.outputs.target && inputs.skip-java-setup != 'true' }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      if: ${{ steps.branch.outputs.target && inputs.skip-java-setup != 'true' }}

    - name: Generate and push schemas
      if: ${{ steps.branch.outputs.target }}
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        TASK: ${{ inputs.gradle-task }}
        REPOS: ${{ inputs.config-repos }}
        TARGET_BRANCH: ${{ steps.branch.outputs.target }}
      run: |
        set -euo pipefail
        chmod +x gradlew
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Generated mappings and the merged prefab schema depend on what other repos already wrote,
        # so a push rejected by a concurrent run is retried by regenerating on top of the new commit
        for repo in $REPOS; do
          dir="$RUNNER_TEMP/schemas-${repo//\//-}"
          for attempt in 1 2 3 4 5; do
            rm -rf "$dir"
            git clone --quiet --depth 1 --branch "$TARGET_BRANCH" "https://x-access-token:$TOKEN@github.com/$repo.git" "$dir"
            ./gradlew "$TASK" "-PschemaOutput=$dir"
            cd "$dir"
            # .idea is gitignored in some config repos, so the schema paths are added explicitly
            for path in .idea/schemas .idea/schema-fragments .idea/jsonSchemas.xml .vscode/settings.json .zed/settings.json; do
              if [ -e "$path" ]; then git add -f -A -- "$path"; fi
            done
            if git diff --cached --quiet; then
              echo "$repo@$TARGET_BRANCH: schemas already up to date"
              cd "$GITHUB_WORKSPACE"
              break
            fi
            git commit --quiet -m "chore: update json schemas from ${GITHUB_REPOSITORY#*/}@${GITHUB_SHA::7}"
            if git push --quiet origin "$TARGET_BRANCH"; then
              echo "$repo@$TARGET_BRANCH: pushed updated schemas"
              cd "$GITHUB_WORKSPACE"
              break
            fi
            cd "$GITHUB_WORKSPACE"
            if [ "$attempt" = 5 ]; then echo "Could not push schemas to $repo@$TARGET_BRANCH"; exit 1; fi
            sleep $((attempt * 5))
          done
        done
