name: 'Publish MineInAbyss packages'
description: 'Publishes to our maven repo, documentation, and release jars'
inputs:
  pages-path:
    description: 'The path to publish to GitHub Pages'
    required: false
    default: ''
  run-gradle-build:
    description: 'Whether to run a default gradle build'
    required: false
    default: 'true'
  release-files:
    description: 'The files to attach to the release'
    required: false
    default: ''
  publish-github-release:
    description: 'Whether to publish a GitHub release'
    required: false
    default: 'true'
  maven-username:
    description: 'The username of the repository to publish to'
    required: false
    default: ''
  maven-password:
    description: 'The password of the repository to publish to'
    required: false
    default: ''
  pre-build:
    description: 'Shell commands to run before building with gradle'
    required: false
    default: ''
  build-tasks:
    description: 'Tasks to run for the gradle build, can have multiple space separated tasks'
    required: false
    default: 'build publish'
  changelog-prefix-file:
    description: 'A file path to prefix the changelog with'
    required: false
    default: ''
  skip-java-setup:
    description: "Don't run setup JDK and gradle tasks (useful if another action using this one needs them setup manually)"
    required: false
    default: false
  develop-branch:
    description: 'When the workflow runs on this branch, publish to snapshots instead of releases'
    required: false
    default: 'develop'
  snapshot-branch:
    description: 'When the workflow runs on this branch, publish to snapshots instead of releases'
    required: false
    default: 'snapshot'
runs:
  using: "composite"
  steps:
    - name: Set build type environment variables
      shell: bash
      run: |
        echo "IS_DEVELOP_BUILD=${{ github.ref == format('refs/heads/{0}', inputs.develop-branch) }}" >> $GITHUB_ENV
        echo "IS_SNAPSHOT_BUILD=${{ github.ref == format('refs/heads/{0}', inputs.snapshot-branch) }}" >> $GITHUB_ENV
        echo "IS_SNAPSHOT=${{ github.ref == format('refs/heads/{0}', inputs.develop-branch) || github.ref == format('refs/heads/{0}', inputs.snapshot-branch) }}" >> $GITHUB_ENV

    - name: ☕️ Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
      if: ${{ inputs.skip-java-setup != 'true' }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      if: ${{ inputs.skip-java-setup != 'true' }}

    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x gradlew

    - name: 🐘️ Get MAJOR.MINOR version from gradle
      shell: bash
      id: extract_version
      run: |
        if [ -f "gradle.properties" ] && grep -q "^version=" gradle.properties; then
          echo "VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2 | xargs)" >> $GITHUB_ENV
        else
          echo "VERSION=$(./gradlew properties --console=plain -q | grep "^version:" | awk '{printf $2}')" >> $GITHUB_ENV
        fi
      if: ${{ inputs.publish-github-release == 'true' }}

    - name: Get next semver version
      shell: bash
      run: |
        if [[ "${{ env.IS_SNAPSHOT_BUILD }}" == "true" ]]; then
          echo "BUMPED_VERSION=${{ env.VERSION }}-SNAPSHOT" >> $GITHUB_ENV
        else
          echo "BUMPED_VERSION=$(${{ github.action_path }}/nextVersion.main.kts ${{ env.VERSION }} master)" >> $GITHUB_ENV
        fi
      if: ${{ inputs.publish-github-release == 'true' }}

    - name: 🐘️ Run pre-build tasks
      shell: bash
      run: ${{ inputs.pre-build }}
      if: ${{ inputs.pre-build != '' }}

    - name: 🐘️ Run gradle build and publish
      shell: bash
      run: >
        ./gradlew ${{ inputs.build-tasks }}
        -PmineinabyssMavenUsername=${{ inputs.maven-username }}
        -PmineinabyssMavenPassword=${{ inputs.maven-password }}
        -Pplugin_path=${{ github.workspace }}/publish
        -Pversion=${{ env.BUMPED_VERSION }}
        -Ppaperweight.experimental.sharedCaches=true
      if: ${{ inputs.run-gradle-build == 'true' }}

    - name: Copy cliff config to workspace for docker
      shell: bash
      run: |
        mkdir -p ${{ github.workspace }}/mineinabyss-cliff
        cp ${{ github.action_path }}/mineinabyss-cliff.toml ${{ github.workspace }}/mineinabyss-cliff/cliff.toml
      if: ${{ inputs.publish-github-release == 'true' && env.IS_SNAPSHOT_BUILD == 'false' }}

    - name: Get changelog from CHANGELOG.md if present
      shell: bash
      id: changelog
      continue-on-error: true
      run: |
        echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
        ${{ github.action_path }}/changelog.main.kts '${{ env.BUMPED_VERSION }}' >> $GITHUB_OUTPUT
        echo "EOF" >> "$GITHUB_OUTPUT"
      if: ${{ inputs.publish-github-release == 'true' && env.IS_SNAPSHOT_BUILD == 'false' }}

    - name: 📃️ Generate a changelog
      uses: orhun/git-cliff-action@v4
      id: git-cliff
      with:
        config: "./mineinabyss-cliff/cliff.toml"
        args: --unreleased ${{ !env.IS_SNAPSHOT && '--ignore-tags=".*-(alpha|dev|pre|beta).*"' || '' }} --github-repo ${{ github.repository }}
      if: ${{ inputs.publish-github-release == 'true' && steps.changelog.outcome == 'failure' && env.IS_SNAPSHOT_BUILD == 'false' }}

    - name: Read changelog prefix file
      id: changelog-prefix
      uses: juliangruber/read-file-action@v1
      with:
        path: ${{ inputs.changelog-prefix-file }}
      if: ${{ inputs.changelog-prefix-file != '' && env.IS_SNAPSHOT_BUILD == 'false' }}

    - name: 📦️ Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ github.token }}
        target_commitish: ${{ github.sha }}
        body: >
          ${{ steps.changelog-prefix.outputs.content || '' }}
          ${{ steps.changelog.outputs.CHANGELOG || steps.git-cliff.outputs.content }}
        prerelease: ${{ env.IS_DEVELOP_BUILD == 'true' }}
        tag_name: v${{ env.BUMPED_VERSION }}
        files: ${{ inputs.release-files }}
      if: ${{ inputs.publish-github-release == 'true' && env.IS_SNAPSHOT_BUILD == 'false' }}

    - name: Upload github pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ inputs.pages-path }}
      if: ${{ inputs.pages-path != '' && env.IS_SNAPSHOT == 'false' }}